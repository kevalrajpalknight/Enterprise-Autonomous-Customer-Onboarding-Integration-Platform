[project]
name = "worker"
version = "0.1.0"
description = "OnboardAI Celery worker"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.5",
    "schemas",
    "prompts",
    "shared",
]

[tool.uv.sources]
schemas = { workspace = true }
prompts = { workspace = true }
shared = { workspace = true }
